[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "22"

# Redirecciones de la web antigua (Squarespace)
[[redirects]]
  from = "/experiencia"
  to = "/casosdeexito/"
  status = 301
[[redirects]]
  from = "/avisolegal"
  to = "https://detres.eu/aviso-legal/"
  status = 301
[[redirects]]
  from = "/poltica-de-privacidad"
  to = "https://detres.eu/privacidad/"
  status = 301
[[redirects]]
  from = "/politicadecookies"
  to = "https://detres.eu/cookies/"
  status = 301
[[redirects]]
  from = "/cart"
  to = "/"
  status = 301

# Caché: recursos con hash (1 año) e imágenes (1 semana)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
