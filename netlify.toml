[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Variables (configurar en Netlify › Site settings › Environment variables):
# NOTION_TOKEN            Integración con acceso SOLO a "Web Consultoria"
# NOTION_DB_CASOS_EXITO   492870e9c3c24377b17cdb375874f551
# NOTION_DB_CONTACTOS     c5a2d82c4df24a9ca2339b9f69219fbf
# NOTION_DB_BLOG           154e61039fef40d9a10b178cc2f9f3ac

# Redirecciones de la web antigua (Squarespace) a la nueva
[[redirects]]
  from = "/detres"
  to = "/"
  status = 301
[[redirects]]
  from = "/experiencia"
  to = "/proyectos/"
  status = 301
[[redirects]]
  from = "/trabaja-con-nosotros"
  to = "/equipo/"
  status = 301
[[redirects]]
  from = "/avisolegal"
  to = "/aviso-legal/"
  status = 301
[[redirects]]
  from = "/poltica-de-privacidad"
  to = "/privacidad/"
  status = 301
[[redirects]]
  from = "/politicadecookies"
  to = "/cookies/"
  status = 301
